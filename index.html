<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6fb">
<title>StudyForge — forge your notes into study kits</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236b4bff'/%3E%3Cstop offset='.6' stop-color='%23a855f7'/%3E%3Cstop offset='1' stop-color='%23ff7a45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 7c3.6 3.4 5.6 6.3 5.6 9.3a5.6 5.6 0 0 1-11.2 0C10.4 13.3 12.4 10.4 16 7Z' fill='%23fff' fill-opacity='.95'/%3E%3Cpath d='M16 18.4c1.7 1.8 2.6 3 2.6 4.1a2.6 2.6 0 0 1-5.2 0c0-1.1.9-2.3 2.6-4.1Z' fill='%23ff9a5a'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint so there is no flash.
  try {
    var savedTheme = localStorage.getItem("studyforge.theme");
    if (savedTheme === "dark" || savedTheme === "light") document.documentElement.dataset.theme = savedTheme;
    if (localStorage.getItem("studyforge.nav") === "collapsed") document.body.classList.add("nav-collapsed");
  } catch (error) { /* private mode */ }
</script>
<style>
  /* ------------------------------------------------------------------
     StudyForge — modern study workspace.
     Violet → ember accent on soft neutral surfaces. Every colour is a token
     so the light and dark themes stay in step.
     ------------------------------------------------------------------ */
  :root{
    color-scheme:light;
    --bg:#f7f6fb;
    --bg-glow-1:rgba(107,75,255,.14);
    --bg-glow-2:rgba(255,122,69,.12);
    --sidebar:rgba(255,255,255,.78);
    --panel:#ffffff; --panel-2:#f7f6fd; --panel-3:#efecfa;
    --line:#e9e6f4; --line-2:#ddd8ee;
    --text:#191627; --muted:#6b6785; --muted-2:#9a95b3;
    --accent:#6b4bff; --accent-ink:#ffffff; --accent-soft:#efebff; --accent-dim:#c9bfff;
    --ember:#ff7a45; --ember-soft:#fff0e9;
    --grad:linear-gradient(135deg,#6b4bff 0%,#a855f7 55%,#ff7a45 110%);
    --grad-soft:linear-gradient(135deg,rgba(107,75,255,.12),rgba(255,122,69,.12));
    --good:#0d9a68; --good-soft:#e7f8f1; --good-line:#b7ebd5;
    --danger:#d92d4b; --danger-soft:#fdeef1; --danger-dim:#f6c9d2;
    --warn:#a86a10; --warn-soft:#fdf3e2;
    --radius:16px; --radius-sm:11px; --radius-xs:8px;
    --shadow:0 1px 2px rgba(24,18,60,.04), 0 8px 24px -18px rgba(24,18,60,.18);
    --shadow-pop:0 32px 70px -32px rgba(28,20,70,.38), 0 4px 12px rgba(28,20,70,.06);
    --ring:0 0 0 3px var(--accent-soft);
    --sidebar-w:272px;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b0a12; --bg-glow-1:rgba(122,92,255,.18); --bg-glow-2:rgba(255,122,69,.12);
    --sidebar:rgba(17,15,28,.82);
    --panel:#141221; --panel-2:#1b182c; --panel-3:#242038;
    --line:#272338; --line-2:#35304c;
    --text:#eeecf8; --muted:#a09cc0; --muted-2:#716d90;
    --accent:#9b86ff; --accent-ink:#120f20; --accent-soft:#241f42; --accent-dim:#4b3f7a;
    --ember:#ff9a5a; --ember-soft:#2a1a12;
    --grad:linear-gradient(135deg,#7d5cff 0%,#b06bff 55%,#ff9a5a 110%);
    --grad-soft:linear-gradient(135deg,rgba(125,92,255,.22),rgba(255,154,90,.16));
    --good:#4ade9b; --good-soft:#10281f; --good-line:#1e4a38;
    --danger:#ff7b8f; --danger-soft:#2b1520; --danger-dim:#552934;
    --warn:#f0b866; --warn-soft:#2a2113;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -22px rgba(0,0,0,.9);
    --shadow-pop:0 40px 80px -30px rgba(0,0,0,.85), 0 3px 10px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(155,134,255,.22);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60vw 55vh at 78% -10%, var(--bg-glow-1), transparent 62%),
      radial-gradient(45vw 45vh at -8% 88%, var(--bg-glow-2), transparent 60%);
  }
  h1,h2,h3,h4{margin:0;line-height:1.22;font-weight:680;letter-spacing:-.025em}
  h1{font-size:2rem}
  h2{font-size:1.02rem}
  h3{font-size:.96rem}
  p{margin:0}
  a{color:inherit;text-decoration:none}
  .muted{color:var(--muted)}
  .small{font-size:.875rem}
  .tiny{font-size:.78rem}
  .danger{color:var(--danger)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.tight{gap:6px}
  .row.center{justify-content:center}
  .stack{display:grid;gap:16px}
  ::selection{background:var(--accent-soft);color:var(--text)}

  /* layout ---------------------------------------------------------- */
  .app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
  .sidebar{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;
    padding:16px 12px;background:var(--sidebar);backdrop-filter:blur(18px);
    border-right:1px solid var(--line);z-index:25;
  }
  .sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 4px 6px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:780;letter-spacing:-.03em}
  .brand-mark{
    width:30px;height:30px;flex:0 0 auto;border-radius:10px;background:var(--grad);
    display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(107,75,255,.7);
  }
  .brand-mark svg{width:17px;height:17px}
  .brand-text{font-size:1.02rem;white-space:nowrap;overflow:hidden}
  .brand-text b{font-weight:800}
  .brand-text span{
    font-weight:700;margin-left:1px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sidebar-tools{display:flex;gap:2px}
  .nav{display:grid;gap:18px;overflow:auto;flex:1;align-content:start;padding:0 2px 8px;scrollbar-width:thin}
  .nav-group{display:grid;gap:2px}
  .nav-label{font-size:.72rem;font-weight:650;color:var(--muted-2);text-transform:uppercase;letter-spacing:.09em;padding:0 8px 6px}
  .nav-label-row{display:flex;align-items:center;justify-content:space-between;padding-right:4px}
  .nav-label-row .nav-label{padding-bottom:0}
  .nav-item{
    display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:10px;
    background:transparent;color:var(--muted);font:inherit;font-size:.875rem;font-weight:520;
    text-align:left;cursor:pointer;min-height:34px;transition:background .14s,color .14s;
  }
  .nav-item:hover{background:var(--panel-3);color:var(--text)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:640}
  .nav-item.current{color:var(--text);font-weight:620}
  .nav-item .count{
    margin-left:auto;font-size:.72rem;color:var(--muted-2);font-variant-numeric:tabular-nums;
    background:var(--panel-3);border-radius:999px;padding:0 7px;line-height:1.6;
  }
  .nav-item.active .count{background:rgba(255,255,255,.55);color:var(--accent)}
  html[data-theme="dark"] .nav-item.active .count{background:rgba(255,255,255,.08)}
  .nav-icon{flex:0 0 auto;width:17px;height:17px;display:grid;place-items:center;color:currentColor}
  .nav-icon svg{width:16px;height:16px}
  .nav-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-add{color:var(--muted-2);font-size:.84rem}
  .nav-add:hover{color:var(--text)}
  .nav-empty{color:var(--muted-2);font-size:.76rem;padding:4px 10px 8px;line-height:1.45}
  .nav-subhead{font-size:.72rem;font-weight:620;color:var(--muted-2);padding:6px 10px 2px}
  .nav-tree{display:grid;gap:1px}
  .nav-caret{display:grid;place-items:center;width:14px;height:14px;flex:0 0 auto;color:var(--muted-2);transition:transform .18s ease}
  .nav-caret svg{width:12px;height:12px}
  .nav-tree.open > .nav-item > .nav-caret{transform:rotate(90deg);color:var(--accent)}
  .nav-kit.open .nav-caret{transform:rotate(90deg);color:var(--accent)}
  .nav-children{
    display:grid;gap:1px;margin:1px 0 4px 18px;padding-left:9px;
    border-left:1px solid var(--line-2);animation:nav-in .18s ease-out;
  }
  @keyframes nav-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .nav-children .nav-item{font-size:.835rem;min-height:31px;padding:5px 8px}
  .nav-children .nav-children{margin-left:6px}
  .nav-leaf{
    display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;
    color:var(--muted);font-size:.83rem;font-weight:500;transition:background .14s,color .14s;
  }
  .nav-leaf .nav-icon svg{width:14px;height:14px}
  .nav-leaf:hover{background:var(--panel-3);color:var(--text)}
  .nav-leaf.active{background:var(--accent-soft);color:var(--accent);font-weight:620}
  .nav-leaf .count{margin-left:auto;font-size:.7rem;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .nav-leaf.active .count{color:var(--accent)}
  .sidebar-foot{display:grid;gap:10px;border-top:1px solid var(--line);padding:12px 2px 0}
  .user-row{display:flex;align-items:center;gap:9px;padding:2px 6px}
  .avatar{
    width:28px;height:28px;flex:0 0 auto;border-radius:99px;background:var(--grad);color:#fff;
    display:grid;place-items:center;font-size:.72rem;font-weight:750;
  }
  .user-meta{display:grid;min-width:0;line-height:1.25}
  .user-meta strong{font-size:.8rem;font-weight:640}
  .user-meta span{font-size:.72rem;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .storage{display:grid;gap:5px;padding:0 6px}
  .storage-row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted-2)}
  .meter{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
  .meter > span{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s ease}

  .content{min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 32px;background:var(--bg);background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  }
  .search{flex:1;max-width:460px}
  .search input{
    width:100%;padding:9px 14px;border-radius:11px;border:1px solid transparent;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:.855rem;
  }
  .search input::placeholder{color:var(--muted-2)}
  .search input:focus{background:var(--panel);border-color:var(--accent-dim);outline:none;box-shadow:var(--ring)}
  .top-actions{display:flex;gap:2px;margin-left:auto}
  .menu-btn{display:none}
  .view{padding:34px 40px 120px;max-width:1180px;width:100%;margin:0 auto;flex:1}

  /* buttons --------------------------------------------------------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);
    background:var(--panel);color:var(--text);font:inherit;font-size:.845rem;font-weight:560;
    cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:var(--panel-2);border-color:var(--accent-dim);transform:translateY(-1px)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.primary{
    background:var(--grad);border-color:transparent;color:#fff;
    box-shadow:0 10px 24px -14px rgba(107,75,255,.9);
  }
  .btn.primary:hover:not(:disabled){filter:brightness(1.06);border-color:transparent;box-shadow:0 14px 28px -14px rgba(107,75,255,.95)}
  .btn.lg{padding:11px 20px;font-size:.9rem;border-radius:12px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
  .btn.ghost:hover:not(:disabled){background:var(--panel-3);color:var(--text);border-color:transparent}
  .btn.small{padding:6px 11px;font-size:.79rem;border-radius:9px}
  .btn.full{width:100%}
  .btn.danger{color:var(--danger);box-shadow:none}
  .btn.danger:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger-dim)}
  .btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:none}
  .btn.known{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
  .btn.known:hover:not(:disabled){background:var(--good-soft);border-color:var(--good)}
  .btn.again{background:var(--ember-soft);border-color:transparent;color:var(--warn)}
  .icon-btn{
    width:32px;height:32px;display:grid;place-items:center;border-radius:9px;border:0;
    background:transparent;color:var(--muted);cursor:pointer;transition:background .14s,color .14s;
  }
  .icon-btn:hover{background:var(--panel-3);color:var(--text)}
  .icon-btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
  .icon-btn.tiny{width:24px;height:24px;border-radius:7px}
  .icon-btn svg{width:16px;height:16px}
  .icon-btn.tiny svg{width:14px;height:14px}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed}
  .fab{
    position:fixed;right:26px;bottom:26px;z-index:30;width:52px;height:52px;border-radius:16px;
    display:grid;place-items:center;border:0;cursor:pointer;
    background:var(--grad);color:#fff;
    box-shadow:0 18px 34px -14px rgba(107,75,255,.85);
    transition:transform .16s ease;
  }
  .fab:hover{transform:translateY(-2px) scale(1.03)}
  .fab svg{width:22px;height:22px}

  /* page furniture -------------------------------------------------- */
  .page{display:grid;gap:18px;animation:fade-up .32s ease-out both}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .page-title{display:grid;gap:4px}
  .eyebrow{
    color:var(--accent);font-size:.74rem;font-weight:680;letter-spacing:.1em;text-transform:uppercase;
  }
  .page-sub{margin-top:2px;color:var(--muted);font-size:.865rem;max-width:74ch}
  .crumbs{display:flex;gap:7px;align-items:center;font-size:.79rem;color:var(--muted-2);flex-wrap:wrap}
  .crumbs a{color:var(--muted)}
  .crumbs a:hover{color:var(--accent)}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;min-width:0;box-shadow:var(--shadow);
  }
  .panel .panel{background:var(--panel-2);box-shadow:none}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .panel-head h2{margin:0}
  .count{
    font-size:.72rem;color:var(--muted-2);background:var(--panel-2);border:1px solid var(--line);
    padding:1px 8px;border-radius:99px;font-weight:560;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
    display:grid;gap:6px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  .card:hover{border-color:var(--accent-dim);transform:translateY(-1px)}
  .grid{display:grid;gap:10px}
  .class-group{display:grid;gap:9px}
  .class-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 0}
  .class-head h2{font-size:.9rem;font-weight:660}
  .class-head .count{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .kit-layout{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}

  /* stat strip ------------------------------------------------------ */
  .stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .stat{
    display:grid;gap:2px;padding:15px 16px;border-radius:var(--radius);background:var(--panel);
    border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .stat::after{content:"";position:absolute;inset:auto -20px -30px auto;width:90px;height:90px;border-radius:50%;background:var(--grad-soft);pointer-events:none}
  .stat > *{position:relative}
  .stat-value{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .stat-label{font-size:.75rem;color:var(--muted);font-weight:520}
  .stat.accent .stat-value{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  @media (max-width:820px){ .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* kit rows (dashboard) */
  .kit-card{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:18px 20px}
  .kit-figure{
    display:grid;place-items:center;width:46px;height:46px;border-radius:13px;
    font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
    background:var(--grad-soft);color:var(--accent);border:1px solid var(--line);
  }
  .kit-body{display:grid;gap:3px;min-width:0}
  .kit-body h3{font-size:.98rem;font-weight:660;overflow-wrap:anywhere}
  .kit-body h3 a:hover{color:var(--accent)}
  .kit-meta{color:var(--muted);font-size:.83rem;overflow-wrap:anywhere}
  .kit-sub{color:var(--muted-2);font-size:.76rem;overflow-wrap:anywhere}
  .kit-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  .kit-tag{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}

  .chip{
    display:inline-block;max-width:100%;font-size:.73rem;font-weight:520;line-height:1.5;
    color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
    padding:1px 8px;border-radius:99px;overflow-wrap:anywhere;word-break:break-word;text-align:left;
  }
  .card .subject{overflow-wrap:anywhere}
  .badge{
    font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel-2);
    color:var(--muted);white-space:nowrap;border:1px solid var(--line);
  }
  .badge.ready{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
  .badge.processing{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .badge.error{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    font-size:.76rem;font-weight:540;white-space:nowrap;
  }
  .pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:640}
  .tiny-pill{font-size:.7rem;padding:1px 8px}

  .empty{
    display:grid;gap:10px;justify-items:center;text-align:center;padding:38px 20px;
    border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--muted);
    background:var(--panel-2);
  }
  .empty.hero{
    padding:64px 24px;
    background:radial-gradient(120% 120% at 50% 0%, var(--accent-soft), transparent 70%), var(--panel);
    border-style:solid;border-color:var(--line);
  }
  .empty h2,.empty h3{color:var(--text)}
  .empty.hero h2{font-size:1.5rem}

  .dropzone{
    display:grid;gap:6px;justify-items:center;text-align:center;padding:26px 16px;
    border:1.5px dashed var(--line-2);border-radius:var(--radius-sm);
    background:var(--panel-2);transition:border-color .15s,background .15s;
  }
  .dropzone.dragging{border-color:var(--accent);background:var(--accent-soft)}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 6px;color:var(--muted-2);font-size:.76rem}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .field{display:grid;gap:6px;margin:13px 0}
  .field label,.label{font-weight:600;font-size:.82rem}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hint{color:var(--muted-2);font-size:.76rem;line-height:1.5}
  input[type=text],input[type=password],input[type=search],select,textarea{
    width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);
    background:var(--panel);color:var(--text);font:inherit;font-size:.87rem;
    transition:border-color .14s,box-shadow .14s;
  }
  textarea{resize:vertical;line-height:1.6}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-dim);box-shadow:var(--ring)}
  input:disabled,textarea:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed}

  /* resources ------------------------------------------------------- */
  .res-list{display:grid;gap:2px}
  .res-row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;border:1px solid transparent;transition:background .14s,border-color .14s}
  .res-row:hover{background:var(--panel-2);border-color:var(--line)}
  .res-icon{
    flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    font-size:.6rem;font-weight:750;letter-spacing:.04em;
    background:var(--panel-2);color:var(--muted);border:1px solid var(--line);
  }
  .res-icon.pdf{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .res-icon.text{background:var(--good-soft);color:var(--good);border-color:transparent}
  .res-main{flex:1;min-width:0;display:grid;gap:1px}
  .res-name{font-weight:580;font-size:.87rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-name:hover{color:var(--accent)}
  .res-main p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .notice{padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);font-size:.84rem;color:var(--muted)}
  .notice strong{color:var(--text);font-weight:640}
  .notice.error{border-color:var(--danger-dim);background:var(--danger-soft);color:var(--danger)}
  .notice.subtle{background:transparent;border-color:var(--line)}
  .notice.error-soft{border-color:var(--danger-dim);background:var(--danger-soft);color:var(--danger);display:grid;gap:6px;justify-items:start}
  .notice.subtle strong{color:var(--text)}

  /* markdown -------------------------------------------------------- */
  .md{max-width:74ch;font-size:.93rem;line-height:1.72}
  .md > * + *{margin-top:.7em}
  .md h2{font-size:1.22rem;margin-top:1.5em}
  .md h3{font-size:1.05rem;margin-top:1.3em;color:var(--text)}
  .md h4{font-size:.95rem;margin-top:1.2em;color:var(--muted)}
  .md ul,.md ol{padding-left:1.35em;margin:.4em 0}
  .md li+li{margin-top:.25em}
  .md blockquote{margin:0;padding:9px 14px;border-left:3px solid var(--accent-dim);background:var(--panel-2);border-radius:0 10px 10px 0;color:var(--muted)}
  .md code{background:var(--panel-3);padding:1px 5px;border-radius:5px;font:.86em ui-monospace,SFMono-Regular,Menlo,monospace}
  .md pre{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
  .md pre code{background:none;padding:0}
  .md hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
  .md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .md strong{color:var(--text);font-weight:680}
  .doc-editor{font:.86rem/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:380px}

  /* quiz ------------------------------------------------------------ */
  .quiz{display:grid;gap:14px;padding-left:0;margin:0;list-style:none}
  .quiz .q{display:grid;gap:9px}
  .q-text{font-weight:560}
  .options{display:grid;gap:7px}
  .option{
    display:flex;gap:11px;align-items:center;text-align:left;width:100%;
    padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font:inherit;font-size:.88rem;cursor:pointer;
    transition:border-color .14s,background .14s,transform .12s,box-shadow .14s;
  }
  .option:hover{border-color:var(--accent-dim);background:var(--panel-2);transform:translateX(2px)}
  .option.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--ring)}
  .option.correct{border-color:var(--good);background:var(--good-soft)}
  .option.wrong{border-color:var(--danger);background:var(--danger-soft)}
  .opt-letter{
    flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--panel-3);
    display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);
  }
  .option.selected .opt-letter{background:var(--accent);color:#fff}
  .option.correct .opt-letter{background:var(--good);color:#fff}
  .option.wrong .opt-letter{background:var(--danger);color:#fff}
  .opt-flag{margin-left:auto;font-size:.7rem;font-weight:650;color:var(--good);white-space:nowrap}
  .opt-flag.wrong{color:var(--danger)}
  .explanation{color:var(--muted);font-size:.83rem;border-left:2px solid var(--line-2);padding-left:11px;line-height:1.6}
  .answer{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.86rem}
  .q-number{
    display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;
    margin-right:8px;border-radius:7px;background:var(--panel-3);
    font-size:.72rem;font-weight:700;color:var(--muted);
  }

  /* quiz run -------------------------------------------------------- */
  .quiz-shell{display:grid;gap:16px;max-width:820px;margin:0 auto;width:100%}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .quiz-progress-wrap{display:grid;gap:8px;flex:1;min-width:200px}
  .quiz-progress-text{display:flex;align-items:baseline;gap:7px;font-size:.86rem}
  .quiz-progress-text strong{font-weight:680}
  .quiz-score-chip{
    margin-left:auto;font-size:.74rem;font-weight:640;color:var(--accent);background:var(--accent-soft);
    border-radius:99px;padding:2px 10px;
  }
  .quiz-dots{display:flex;gap:5px;flex-wrap:wrap}
  .quiz-dot{
    width:26px;height:5px;border-radius:99px;background:var(--panel-3);
    transition:background .2s,width .2s;
  }
  .quiz-dot.current{background:var(--accent-dim);width:34px}
  .quiz-dot.ok{background:var(--good)}
  .quiz-dot.bad{background:var(--danger)}
  .quiz-card{
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;
    display:grid;gap:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    animation:fade-up .28s ease-out both;
  }
  .quiz-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.85}
  .quiz-card.is-correct::before{background:var(--good)}
  .quiz-card.is-wrong::before{background:var(--danger)}
  .quiz-q-head{display:flex;align-items:center;gap:8px}
  .q-badge{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px;
  }
  .quiz-q-text{font-size:1.22rem;line-height:1.45;font-weight:640;letter-spacing:-.015em}
  .options-quiz .option{padding:13px 15px;font-size:.9rem}
  .short-wrap{display:grid;gap:7px}
  .short-input{min-height:130px;font-size:.92rem;line-height:1.65}
  .quiz-feedback{display:grid;gap:8px;padding:16px;border-radius:14px;animation:fade-up .25s ease-out both}
  .quiz-feedback.ok{background:var(--good-soft);border:1px solid var(--good-line)}
  .quiz-feedback.bad{background:var(--danger-soft);border:1px solid var(--danger-dim)}
  .feedback-head{display:flex;align-items:center;gap:9px;font-size:.92rem}
  .feedback-head strong{font-weight:700}
  .feedback-icon{
    display:grid;place-items:center;width:24px;height:24px;border-radius:99px;
    background:var(--good);color:#fff;font-size:.78rem;font-weight:800;
  }
  .quiz-feedback.bad .feedback-icon{background:var(--danger)}
  .feedback-head .pill{margin-left:auto;background:rgba(255,255,255,.5);border-color:transparent}
  html[data-theme="dark"] .feedback-head .pill{background:rgba(255,255,255,.08)}
  .feedback-note{font-size:.87rem;line-height:1.6;color:var(--text)}
  .feedback-answer{font-size:.85rem;color:var(--text);background:rgba(255,255,255,.45);border-radius:9px;padding:8px 11px}
  html[data-theme="dark"] .feedback-answer{background:rgba(255,255,255,.05)}
  .quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .spinner{
    width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* quiz intro + results ------------------------------------------- */
  .quiz-hero{
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    padding:22px;border-radius:var(--radius);background:var(--grad-soft);border:1px solid var(--line);
    margin-bottom:16px;
  }
  .quiz-hero-text{display:grid;gap:7px;max-width:62ch}
  .quiz-hero h3{font-size:1.28rem}
  .quiz-facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .result-hero{
    display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:24px;
    border-radius:var(--radius);background:var(--grad-soft);border:1px solid var(--line);margin-bottom:20px;
  }
  .score-ring{
    --score:0;
    width:112px;height:112px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;position:relative;
    background:conic-gradient(var(--accent) calc(var(--score) * 1%), var(--panel-3) 0);
    animation:fade-up .4s ease-out both;
  }
  .score-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
  .score-ring-value{position:relative;font-size:1.75rem;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .score-ring-value small{font-size:.85rem;font-weight:600;color:var(--muted);margin-left:1px}
  .result-hero-text{display:grid;gap:6px;flex:1;min-width:220px}
  .result-hero-text h3{font-size:1.4rem}
  .result-hero-text .row{margin-top:8px}
  .attempts-panel{margin-top:4px}
  .attempt-list{display:grid;gap:6px;list-style:none;margin:0;padding:0}
  .attempt-row{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap;
  }
  .attempt-score{
    width:48px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;
    font-size:.82rem;font-weight:720;font-variant-numeric:tabular-nums;
    background:var(--panel-3);color:var(--muted);
  }
  .attempt-score.good{background:var(--good-soft);color:var(--good)}
  .attempt-score.mid{background:var(--warn-soft);color:var(--warn)}
  .attempt-score.low{background:var(--danger-soft);color:var(--danger)}
  .attempt-main{display:grid;gap:1px;min-width:120px;font-size:.84rem}
  .attempt-bar{flex:1;height:5px;border-radius:99px;background:var(--panel-3);overflow:hidden;min-width:60px}
  .attempt-bar > span{display:block;height:100%;background:var(--grad);border-radius:99px}
  .review-head{margin:18px 0 10px;font-size:.95rem;font-weight:660}
  .review-list{display:grid;gap:10px;padding-left:0;margin:0;list-style:none}
  .review-item{
    display:grid;gap:7px;padding:15px 16px;border-radius:13px;background:var(--panel);
    border:1px solid var(--line);border-left:4px solid var(--line-2);
  }
  .review-item.q-correct{border-left-color:var(--good)}
  .review-item.q-wrong{border-left-color:var(--danger)}
  .review-item-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .review-item .q-number{margin-right:0}
  .answer-line{font-size:.86rem;line-height:1.55;overflow-wrap:anywhere}
  .answer-line .muted{font-weight:600;margin-right:4px}

  /* tabs ------------------------------------------------------------ */
  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    display:inline-flex;align-items:center;gap:7px;padding:9px 1px 11px;
    color:var(--muted);font-size:.86rem;font-weight:540;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .14s,border-color .14s;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:660}
  .tab .count{background:transparent;border:0;padding:0;color:var(--muted-2);font-size:.76rem}
  .tab.active .count{color:var(--accent)}

  /* flashcards ------------------------------------------------------ */
  .deck{display:grid;gap:14px;margin-top:6px;justify-items:center;width:100%}
  .deck-bar{display:flex;justify-content:space-between;gap:10px;width:100%}
  .deck-meter{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden;width:100%}
  .deck-meter > span{display:block;height:100%;background:var(--grad);transition:width .3s ease}
  .fc-stage{width:min(560px,100%);perspective:1600px;animation:fc-in .34s cubic-bezier(.2,.8,.2,1)}
  @keyframes fc-in{
    from{opacity:0;transform:translateY(10px) scale(.985)}
    to{opacity:1;transform:none}
  }
  .flashcard{
    display:block;position:relative;width:100%;height:clamp(250px,34vh,330px);
    padding:0;border:0;background:none;font:inherit;color:var(--text);cursor:pointer;
    perspective:1600px;-webkit-tap-highlight-color:transparent;
  }
  .fc-inner{
    position:absolute;inset:0;display:block;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .flashcard.is-flipped .fc-inner{transform:rotateY(180deg)}
  .flashcard:hover .fc-face{border-color:var(--accent-dim)}
  .flashcard:focus-visible{outline:none}
  .flashcard:focus-visible .fc-face{box-shadow:var(--ring),var(--shadow)}
  .fc-face{
    position:absolute;inset:0;display:grid;gap:14px;align-content:center;justify-items:center;
    text-align:center;padding:34px 28px;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);
    transition:box-shadow .2s,border-color .2s;
  }
  .fc-front{
    background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 100%);
  }
  .fc-front::after{
    content:"";position:absolute;inset:auto auto 0 0;width:100%;height:4px;border-radius:0 0 22px 22px;
    background:var(--grad);opacity:.75;
  }
  .fc-back{
    transform:rotateY(180deg);color:#fff;border-color:transparent;
    background:linear-gradient(150deg,#5b3df5 0%,#8b5cf6 55%,#ff8a5c 130%);
  }
  .fc-side{
    font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:750;
    color:var(--accent);opacity:.85;
  }
  .fc-back .fc-side{color:rgba(255,255,255,.85)}
  .fc-text{
    font-size:1.25rem;line-height:1.5;max-width:52ch;overflow-wrap:anywhere;font-weight:600;letter-spacing:-.015em;
    max-height:100%;overflow:auto;padding-right:2px;scrollbar-width:thin;
  }
  .fc-back .fc-text{font-weight:520;font-size:1.12rem}
  .fc-hint{font-size:.72rem;color:var(--muted-2)}
  .fc-back .fc-hint{color:rgba(255,255,255,.7)}
  .fc-controls{display:flex;align-items:center;justify-content:center;gap:10px}
  .fc-flip-btn{min-width:140px}
  .deck-tools{margin-top:2px}
  .deck-list{
    margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px;width:100%;
    max-height:420px;overflow:auto;
  }
  .deck-list li{
    padding:11px 14px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);
  }
  .deck-list p{margin:0}
  .center{justify-content:center}

  /* practice test --------------------------------------------------- */
  .exam-brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
  .exam-brief > div{
    display:grid;gap:2px;padding:16px;border-radius:13px;background:var(--panel-2);
    border:1px solid var(--line);text-align:center;
  }
  .exam-figure{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .exam-bar{
    position:sticky;top:66px;z-index:5;display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;padding:12px 15px;margin:-4px 0 16px;border-radius:13px;
    background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow);
  }
  .exam-timer{display:flex;align-items:baseline;gap:8px}
  .exam-clock{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--text)}
  .exam-clock.warn{color:var(--danger);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  .exam-questions{padding-left:0;list-style:none;display:grid;gap:18px;margin:0}
  .exam-questions .q{display:grid;gap:10px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2)}
  .option.static{cursor:default}
  .option.static:hover{background:var(--panel);border-color:var(--line);transform:none}
  .option.static.correct:hover{background:var(--good-soft)}
  .option.static.wrong:hover{background:var(--danger-soft)}
  .result-card{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px;border-radius:14px;
    background:var(--panel-2);border:1px solid var(--line);
  }
  .result-score{font-size:2.4rem;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
  .result-score .muted{font-size:1.15rem;font-weight:500}
  .result-percent{font-size:1.05rem;color:var(--muted)}
  .result-meter{height:6px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin:12px 0 4px}
  .result-meter > span{display:block;height:100%;background:var(--grad)}
  .q-correct .q-text,.q-wrong .q-text{font-weight:600}
  @media (max-width:640px){ .exam-brief{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* coverage chips -------------------------------------------------- */
  .coverage{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .coverage-item{
    display:inline-flex;align-items:center;gap:7px;max-width:100%;
    padding:3px 4px 3px 10px;border-radius:99px;font-size:.76rem;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    overflow-wrap:anywhere;
  }
  .coverage-item > span{
    min-width:20px;padding:0 7px;border-radius:99px;text-align:center;
    background:var(--panel-3);font-variant-numeric:tabular-nums;font-weight:650;color:var(--text);
  }
  .coverage-item.empty{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .coverage-item.empty > span{background:rgba(161,98,7,.12);color:var(--warn)}

  /* documents tab --------------------------------------------------- */
  .doc-layout{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:18px;align-items:start}
  .doc-side{padding:12px}
  .doc-list{display:grid;gap:2px}
  .doc-item{
    display:flex;align-items:center;gap:9px;width:100%;padding:8px;border:1px solid transparent;
    border-radius:10px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;
  }
  .doc-item:hover{background:var(--panel-2)}
  .doc-item.active{background:var(--accent-soft);border-color:transparent}
  .doc-item-main{display:grid;gap:1px;min-width:0;flex:1}
  .doc-item-name{font-size:.84rem;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-item .res-icon{width:29px;height:29px;font-size:.55rem}
  @media (max-width:860px){ .doc-layout{grid-template-columns:1fr} .doc-side{order:-1} }

  /* job bar --------------------------------------------------------- */
  .job-bar{
    position:fixed;right:22px;bottom:92px;z-index:40;width:min(410px,calc(100vw - 44px));
    display:grid;gap:10px;padding:15px 17px;border-radius:15px;
    background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);
  }
  .job-bar[hidden]{display:none}
  .job-info{display:grid;gap:3px}
  .job-title{font-weight:640;font-size:.87rem}
  .job-step{color:var(--muted);font-size:.78rem}
  .job-bar .btn{justify-self:end}
  .job-bar .meter{height:5px}

  /* toasts ---------------------------------------------------------- */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
  .toast{
    padding:10px 16px;border-radius:11px;background:var(--text);color:var(--bg);
    font-size:.83rem;font-weight:540;box-shadow:var(--shadow-pop);animation:toast-in .2s ease-out;
  }
  .toast.success{background:var(--good);color:#fff}
  .toast.error{background:var(--danger);color:#fff}
  .toast.leaving{opacity:0;transform:translateY(6px);transition:all .25s}
  @keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* modal ----------------------------------------------------------- */
  .modal-root{position:fixed;inset:0;z-index:70;display:grid;place-items:center}
  .modal-root[hidden]{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(18,12,42,.42);backdrop-filter:blur(6px);animation:fade-in .18s ease-out}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .modal{
    position:relative;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 60px);overflow:auto;
    background:var(--panel);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow-pop);
    display:grid;gap:0;animation:modal-in .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modal-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px 0}
  .modal-head h2{font-size:1.02rem}
  .modal-body{padding:14px 22px 6px}
  .modal-foot{
    display:flex;justify-content:flex-end;gap:8px;padding:15px 22px;border-top:1px solid var(--line);
    background:var(--panel-2);border-radius:0 0 18px 18px;position:sticky;bottom:0;
  }

  /* collapsed sidebar ---------------------------------------------- */
  body.nav-collapsed{--sidebar-w:78px}
  body.nav-collapsed .brand-text,
  body.nav-collapsed .nav-label,
  body.nav-collapsed .nav-label-row .icon-btn,
  body.nav-collapsed .nav-text,
  body.nav-collapsed .nav-caret,
  body.nav-collapsed .nav-item .count,
  body.nav-collapsed .nav-children,
  body.nav-collapsed .user-meta,
  body.nav-collapsed .storage{display:none}
  body.nav-collapsed .sidebar{padding:16px 10px;align-items:stretch}
  body.nav-collapsed .sidebar-top{flex-direction:column;gap:8px;align-items:center;padding-bottom:10px}
  body.nav-collapsed .nav-item{justify-content:center;padding:8px}
  body.nav-collapsed .nav-add{display:none}
  body.nav-collapsed .user-row{justify-content:center}
  body.nav-collapsed #btn-collapse svg{transform:rotate(180deg)}

  @media (max-width:1180px){ .view{padding:28px 28px 120px} .fc-stage{width:min(480px,100%)} }
  @media (max-width:980px){
    .kit-layout{grid-template-columns:1fr}
    .field-row{grid-template-columns:1fr}
    .kit-card{grid-template-columns:auto minmax(0,1fr)}
    .kit-actions{grid-column:1 / -1;justify-content:flex-start}
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;inset:0 auto 0 0;width:280px;height:100vh;transform:translateX(-102%);
      transition:transform .22s ease;z-index:50;box-shadow:var(--shadow-pop);
    }
    body.nav-open .sidebar{transform:none}
    body.nav-collapsed{--sidebar-w:280px}
    body.nav-collapsed .brand-text,body.nav-collapsed .nav-label,body.nav-collapsed .nav-text,
    body.nav-collapsed .nav-caret,body.nav-collapsed .nav-children,
    body.nav-collapsed .nav-item .count,body.nav-collapsed .user-meta,body.nav-collapsed .storage{display:revert}
    body.nav-collapsed .nav-children{display:grid}
    .sidebar-top{flex-direction:row}
    .menu-btn{display:grid}
    .topbar{padding:10px 16px}
    .view{padding:20px 16px 120px}
    .fab{right:16px;bottom:16px}
    .job-bar{right:12px;left:12px;width:auto;bottom:80px}
    .quiz-card{padding:20px;border-radius:16px}
    .quiz-q-text{font-size:1.08rem}
    .fc-stage{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="#/" aria-label="StudyForge home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3c3.6 3.4 5.4 6 5.4 8.6a5.4 5.4 0 0 1-10.8 0C6.6 9 8.4 6.4 12 3Z" fill="currentColor" fill-opacity=".95"/>
            <path d="M12 15.4c1.5 1.6 2.2 2.6 2.2 3.5a2.2 2.2 0 0 1-4.4 0c0-.9.7-1.9 2.2-3.5Z" fill="#ff9a5a"/>
          </svg>
        </span>
        <span class="brand-text"><b>Study</b><span>Forge</span></span>
      </a>
      <div class="sidebar-tools">
        <button class="icon-btn" id="btn-theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn" id="btn-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>

    <nav class="nav" id="nav-classes" aria-label="Library"></nav>

    <div class="sidebar-foot">
      <div class="user-row">
        <span class="avatar" aria-hidden="true">SF</span>
        <div class="user-meta">
          <strong>You</strong>
          <span id="user-meta-line">Stored in this browser</span>
        </div>
      </div>
      <div class="storage" id="storage-meter"></div>
      <button class="nav-item" id="btn-settings" title="Settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></svg></span>
        <span class="nav-text">Settings</span>
      </button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-menu" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search"><input id="search" type="search" placeholder="Search study kits and resources…  (⌘K)" aria-label="Search study kits and resources"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-export" title="Export a JSON backup" aria-label="Export a backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-import" title="Import a backup" aria-label="Import a backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 19h14"/></svg>
        </button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<button class="fab" id="btn-new-kit" title="New study kit" aria-label="New study kit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="job-bar" id="job-bar" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal-root" id="modal-root" hidden></div>
<input type="file" id="pdf-file-input" accept=".pdf,application/pdf" multiple hidden>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<!--
  ARCH.js runtime (https://chibbit-99.github.io/arch.js/docs/).

  ARCH.js fetches ./arch/config.json, loads the modules listed there
  (npmloader.js), runs ./arch/init.js and waits for it, then executes the
  project files in config.json -> "js" in order.

  `latest.js` is used because the documented arch/init.js export syntax is only
  supported by the current build; releases/v0.1.1-alpha.js executes init.js as a
  plain async function, where `export const` is a syntax error.
-->
<script src="https://chibbit-99.github.io/arch.js/releases/latest.js"></script>
<script>
  // Fallback only for the case where ARCH.js itself never starts. Without it
  // the page would stay inert if the runtime CDN is blocked or the runtime
  // fails before reading arch/config.json. src/main.js refuses to run twice,
  // so a late ARCH.js start cannot double-initialise the app.
  (function () {
    var done = false;

    function loadDirectly(reason) {
      if (done || window.__studyForgeBooted) return;
      done = true;
      console.warn("[StudyForge] " + reason + "; loading the project files directly.");
      [
        "./src/store.js?v=2026-10-21a",
        "./src/markdown.js?v=2026-10-21a",
        "./src/ocr.js?v=2026-10-21a",
        "./src/ai.js?v=2026-10-21a",
        "./src/jobs.js?v=2026-10-21a",
        "./src/ui.js?v=2026-10-21a",
        "./src/main.js?v=2026-10-21a",
      ].forEach(function (src) {
        var script = document.createElement("script");
        script.src = src;
        script.async = false; // keep the file order
        document.body.appendChild(script);
      });
    }

    setTimeout(function () {
      if (window.__studyForgeBooted) return;
      if (typeof globalThis.importPackage !== "function") loadDirectly("ARCH.js did not load");
    }, 10000);

    setTimeout(function () {
      loadDirectly("ARCH.js did not finish starting");
    }, 90000);

    window.addEventListener("studyforge:booted", function () {
      done = true;
    });
  })();
</script>
