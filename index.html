<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Symus Study — study kits &amp; AI notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23161616'/%3E%3Cpath d='M10 21c2 2 8 2 10-1 1.6-2.4-1-4-4-4.6-3-.6-4.6-2-3.4-4C13.8 9 19 9 21 11' stroke='%23ffffff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint so there is no flash.
  try {
    var savedTheme = localStorage.getItem("symus.theme");
    if (savedTheme === "dark" || savedTheme === "light") document.documentElement.dataset.theme = savedTheme;
    if (localStorage.getItem("symus.nav") === "collapsed") document.body.classList.add("nav-collapsed");
  } catch (error) { /* private mode */ }
</script>
<style>
  /* ------------------------------------------------------------------
     Symus Study — light, minimal interface with a grouped sidebar.
     Dark mode is the same token set, inverted, via html[data-theme="dark"].
     ------------------------------------------------------------------ */
  :root{
    color-scheme:light;
    --bg:#ffffff; --bg-2:#fafafa; --sidebar:#fafafa;
    --panel:#ffffff; --panel-2:#f7f7f8; --panel-3:#f0f0f1;
    --line:#ededee; --line-2:#e1e1e3;
    --text:#161616; --muted:#71717a; --muted-2:#a1a1aa;
    --accent:#161616; --accent-dim:#d7d7da; --accent-ink:#ffffff;
    --good:#15803d; --good-soft:#edf8f0;
    --danger:#bf2626; --danger-soft:#fdefef; --danger-dim:#f0cccc;
    --warn:#a16207; --warn-soft:#fdf6e7;
    --radius:12px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(17,17,17,.04);
    --shadow-pop:0 24px 60px -28px rgba(17,17,17,.3), 0 2px 6px rgba(17,17,17,.05);
    --sidebar-w:248px;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0f1011; --bg-2:#121314; --sidebar:#0c0d0e;
    --panel:#151617; --panel-2:#1a1c1d; --panel-3:#222526;
    --line:#25282a; --line-2:#33373a;
    --text:#eceeee; --muted:#9aa0a3; --muted-2:#6e7477;
    --accent:#f2f4f4; --accent-dim:#3c4143; --accent-ink:#131414;
    --good:#6fd39a; --good-soft:#12261a;
    --danger:#ff8f86; --danger-soft:#2a1615; --danger-dim:#4d2a27;
    --warn:#e8bf74; --warn-soft:#2a2113;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 30px 70px -30px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.002em;
  }
  h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:640;letter-spacing:-.02em}
  h1{font-size:1.85rem}
  h2{font-size:1rem}
  h3{font-size:.94rem}
  p{margin:0}
  a{color:inherit;text-decoration:none}
  .muted{color:var(--muted)}
  .small{font-size:.86rem}
  .tiny{font-size:.78rem}
  .danger{color:var(--danger)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.tight{gap:6px}
  .row.center{justify-content:center}
  .stack{display:grid;gap:16px}
  ::selection{background:rgba(22,22,22,.12)}

  /* layout ---------------------------------------------------------- */
  .app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
  .sidebar{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;
    padding:16px 12px;background:var(--sidebar);border-right:1px solid var(--line);
  }
  .sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 4px 6px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;font-weight:720;letter-spacing:-.02em}
  .brand-mark{
    width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--text);color:var(--bg);
    display:grid;place-items:center;font-weight:800;font-size:.78rem;letter-spacing:-.03em;
  }
  .brand-text{font-size:.95rem;text-transform:lowercase;white-space:nowrap;overflow:hidden}
  .brand-text b{font-weight:720}
  .brand-text span{color:var(--muted);font-weight:600;margin-left:4px}
  .sidebar-tools{display:flex;gap:2px}
  .nav{display:grid;gap:16px;overflow:auto;flex:1;align-content:start;padding:0 2px}
  .nav-group{display:grid;gap:1px}
  .nav-label{font-size:.78rem;font-weight:520;color:var(--muted);padding:0 8px 6px}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:8px;
    background:transparent;color:var(--muted);font:inherit;font-size:.855rem;font-weight:500;
    text-align:left;cursor:pointer;min-height:32px;
  }
  .nav-item:hover{background:var(--panel-3);color:var(--text)}
  .nav-item.active{background:var(--panel-3);color:var(--text);font-weight:560}
  .nav-item .count{margin-left:auto;font-size:.76rem;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .nav-item.active .count{color:var(--muted)}
  .nav-icon{flex:0 0 auto;width:17px;height:17px;display:grid;place-items:center;color:currentColor}
  .nav-icon svg{width:16px;height:16px}
  .nav-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-add{color:var(--muted-2)}
  .nav-add:hover{color:var(--text)}
  .sidebar-foot{display:grid;gap:10px;border-top:1px solid var(--line);padding:12px 2px 0}
  .user-row{display:flex;align-items:center;gap:9px;padding:2px 6px}
  .avatar{
    width:26px;height:26px;flex:0 0 auto;border-radius:99px;background:var(--text);color:var(--bg);
    display:grid;place-items:center;font-size:.7rem;font-weight:700;
  }
  .user-meta{display:grid;min-width:0;line-height:1.25}
  .user-meta strong{font-size:.8rem;font-weight:600}
  .user-meta span{font-size:.72rem;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .storage{display:grid;gap:5px;padding:0 6px}
  .storage-row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted-2)}
  .meter{height:3px;border-radius:99px;background:var(--panel-3);overflow:hidden}
  .meter > span{display:block;height:100%;background:var(--muted-2);border-radius:99px;transition:width .3s ease}

  .content{min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 28px;background:var(--bg);border-bottom:1px solid var(--line);
  }
  .search{flex:1;max-width:440px}
  .search input{
    width:100%;padding:7px 12px;border-radius:8px;border:1px solid transparent;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:.84rem;
  }
  .search input::placeholder{color:var(--muted-2)}
  .search input:focus{background:var(--bg);border-color:var(--line-2);outline:none}
  .top-actions{display:flex;gap:2px;margin-left:auto}
  .menu-btn{display:none}
  .view{padding:30px 40px 110px;max-width:1120px;width:100%;margin:0 auto;flex:1}

  /* buttons --------------------------------------------------------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);
    background:var(--panel);color:var(--text);font:inherit;font-size:.82rem;font-weight:530;
    cursor:pointer;box-shadow:var(--shadow);transition:background .13s,border-color .13s;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:var(--panel-2);border-color:var(--muted-2)}
  .btn:active:not(:disabled){transform:translateY(.5px)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
  .btn.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);opacity:.88}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
  .btn.ghost:hover:not(:disabled){background:var(--panel-3);color:var(--text);border-color:transparent}
  .btn.small{padding:5px 9px;font-size:.76rem;border-radius:7px}
  .btn.full{width:100%}
  .btn.danger{color:var(--danger);box-shadow:none}
  .btn.danger:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger-dim)}
  .btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
  .icon-btn{
    width:30px;height:30px;display:grid;place-items:center;border-radius:7px;border:0;
    background:transparent;color:var(--muted);cursor:pointer;
  }
  .icon-btn:hover{background:var(--panel-3);color:var(--text)}
  .icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
  .icon-btn svg{width:16px;height:16px}
  .fab{
    position:fixed;right:26px;bottom:26px;z-index:30;width:46px;height:46px;border-radius:13px;
    display:grid;place-items:center;border:0;cursor:pointer;
    background:var(--text);color:var(--bg);
    box-shadow:0 12px 28px -12px rgba(17,17,17,.65),0 2px 6px rgba(17,17,17,.12);
    transition:transform .14s ease;
  }
  .fab:hover{transform:translateY(-1px) scale(1.02)}
  .fab svg{width:20px;height:20px}

  /* page furniture -------------------------------------------------- */
  .page{display:grid;gap:18px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .page-title{display:grid;gap:4px}
  .eyebrow{color:var(--muted);font-size:.8rem;font-weight:450;letter-spacing:0}
  .page-sub{margin-top:2px;color:var(--muted);font-size:.85rem}
  .crumbs{display:flex;gap:7px;align-items:center;font-size:.79rem;color:var(--muted-2);flex-wrap:wrap}
  .crumbs a{color:var(--muted)}
  .crumbs a:hover{color:var(--text)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .panel-head h2{margin:0}
  .count{font-size:.72rem;color:var(--muted-2);background:var(--panel-2);border:1px solid var(--line);padding:1px 7px;border-radius:99px;font-weight:500}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:6px}
  .card:hover{border-color:var(--line-2)}
  .grid{display:grid;gap:10px}
  .class-group{display:grid;gap:8px}
  .class-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 0}
  .class-head h2{font-size:.88rem;font-weight:600}
  .kit-layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}

  /* kit rows (dashboard) */
  .kit-card{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:18px 20px}
  .kit-figure{
    font-size:2rem;font-weight:620;line-height:1;min-width:38px;text-align:left;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  }
  .kit-body{display:grid;gap:3px;min-width:0}
  .kit-body h3{font-size:.96rem;font-weight:620;overflow-wrap:anywhere}
  .kit-body h3 a:hover{text-decoration:underline;text-underline-offset:2px}
  .kit-meta{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
  .kit-sub{color:var(--muted-2);font-size:.76rem;overflow-wrap:anywhere}
  .kit-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  .kit-tag{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}

  .chip{
    display:inline-block;max-width:100%;font-size:.73rem;font-weight:520;line-height:1.5;
    color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
    padding:1px 8px;border-radius:99px;overflow-wrap:anywhere;word-break:break-word;text-align:left;
  }
  .card .subject{overflow-wrap:anywhere}
  .badge{font-size:.72rem;font-weight:520;padding:1px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
  .badge.ready{background:var(--good-soft);color:var(--good);border-color:transparent}
  .badge.processing{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .badge.error{background:var(--danger-soft);color:var(--danger);border-color:transparent}

  .empty{display:grid;gap:8px;justify-items:center;text-align:center;padding:34px 18px;border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--muted)}
  .empty.hero{padding:58px 24px;background:var(--bg-2)}
  .empty h2,.empty h3{color:var(--text)}

  .dropzone{
    display:grid;gap:6px;justify-items:center;text-align:center;padding:22px 16px;
    border:1.5px dashed var(--line-2);border-radius:var(--radius-sm);
    background:var(--bg-2);transition:border-color .15s,background .15s;
  }
  .dropzone.dragging{border-color:var(--text);background:var(--panel-3)}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 6px;color:var(--muted-2);font-size:.76rem}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .field{display:grid;gap:5px;margin:12px 0}
  .field label,.label{font-weight:560;font-size:.82rem}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{color:var(--muted-2);font-size:.76rem;line-height:1.45}
  input[type=text],input[type=password],input[type=search],select,textarea{
    width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line-2);
    background:var(--panel);color:var(--text);font:inherit;font-size:.85rem;
  }
  textarea{resize:vertical;line-height:1.6}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-dim);outline-offset:0;border-color:var(--muted-2)}

  /* resources ------------------------------------------------------- */
  .res-list{display:grid;gap:2px}
  .res-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:1px solid transparent}
  .res-row:hover{background:var(--panel-2);border-color:var(--line)}
  .res-icon{
    flex:0 0 auto;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
    font-size:.6rem;font-weight:700;letter-spacing:.04em;
    background:var(--panel-2);color:var(--muted);border:1px solid var(--line);
  }
  .res-icon.pdf{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .res-icon.text{background:var(--good-soft);color:var(--good);border-color:transparent}
  .res-main{flex:1;min-width:0;display:grid;gap:1px}
  .res-name{font-weight:560;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-name:hover{text-decoration:underline;text-underline-offset:2px}
  .res-main p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .notice{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-size:.83rem;color:var(--muted)}
  .notice strong{color:var(--text);font-weight:600}
  .notice.error{border-color:var(--danger-dim);background:var(--danger-soft);color:var(--danger)}
  .notice.subtle{background:transparent;border-color:var(--line)}
  .notice.error-soft{border-color:var(--danger-dim);background:var(--danger-soft);color:var(--danger);display:grid;gap:6px;justify-items:start}
  .notice.subtle strong{color:var(--text)}

  /* markdown -------------------------------------------------------- */
  .md{max-width:74ch;font-size:.92rem;line-height:1.7}
  .md > * + *{margin-top:.7em}
  .md h2{font-size:1.2rem;margin-top:1.5em}
  .md h3{font-size:1.04rem;margin-top:1.3em;color:var(--text)}
  .md h4{font-size:.95rem;margin-top:1.2em;color:var(--muted)}
  .md ul,.md ol{padding-left:1.35em;margin:.4em 0}
  .md li+li{margin-top:.25em}
  .md blockquote{margin:0;padding:8px 14px;border-left:2px solid var(--line-2);background:var(--panel-2);border-radius:0 8px 8px 0;color:var(--muted)}
  .md code{background:var(--panel-3);padding:1px 5px;border-radius:5px;font:.86em ui-monospace,SFMono-Regular,Menlo,monospace}
  .md pre{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto}
  .md pre code{background:none;padding:0}
  .md hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
  .md a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
  .md strong{color:var(--text);font-weight:650}
  .doc-editor{font:.86rem/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:380px}

  /* quiz ------------------------------------------------------------ */
  .quiz{display:grid;gap:14px;padding-left:20px;margin:0}
  .quiz .q{display:grid;gap:9px}
  .q-text{font-weight:560}
  .options{display:grid;gap:6px}
  .option{
    display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
    padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font:inherit;font-size:.85rem;cursor:pointer;
  }
  .option:hover{border-color:var(--muted-2);background:var(--panel-2)}
  .option.correct{border-color:var(--good);background:var(--good-soft)}
  .option.wrong{border-color:var(--danger);background:var(--danger-soft)}
  .opt-letter{
    flex:0 0 auto;width:19px;height:19px;border-radius:5px;background:var(--panel-3);
    display:grid;place-items:center;font-size:.7rem;font-weight:650;color:var(--muted);
  }
  .option.correct .opt-letter{background:var(--good);color:#fff}
  .option.wrong .opt-letter{background:var(--danger);color:#fff}
  .explanation{color:var(--muted);font-size:.82rem;border-left:2px solid var(--line-2);padding-left:10px}
  .answer{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.85rem}
  .quiz-meta{display:flex;justify-content:space-between;margin-bottom:10px}

  /* tabs ------------------------------------------------------------ */
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    display:inline-flex;align-items:center;gap:7px;padding:9px 1px 10px;
    color:var(--muted);font-size:.85rem;font-weight:520;white-space:nowrap;
    border-bottom:1.5px solid transparent;margin-bottom:-1px;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}
  .tab .count{background:transparent;border:0;padding:0;color:var(--muted-2);font-size:.76rem}
  .tab.active .count{color:var(--muted)}

  /* flashcards ------------------------------------------------------ */
  .deck{display:grid;gap:12px;margin-top:6px}
  .deck-bar{display:flex;justify-content:space-between;gap:10px}
  .deck-meter{height:3px;border-radius:99px;background:var(--panel-3);overflow:hidden}
  .deck-meter > span{display:block;height:100%;background:var(--text);transition:width .25s ease}
  .flashcard{
    display:grid;gap:12px;align-content:center;justify-items:center;text-align:center;
    min-height:240px;padding:32px 24px;border-radius:14px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;
    box-shadow:var(--shadow);
  }
  .flashcard:hover{border-color:var(--muted-2)}
  .flashcard.flipped{background:var(--bg-2);border-color:var(--line-2)}
  .fc-side{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
  .fc-text{font-size:1.18rem;line-height:1.5;max-width:56ch;overflow-wrap:anywhere;font-weight:520}
  .fc-hint{font-size:.72rem;color:var(--muted-2)}
  .deck-tools{margin-top:2px}
  .deck-list{margin:8px 0 0;padding-left:20px;display:grid;gap:13px;max-height:420px;overflow:auto}
  .deck-list p{margin:0}
  .center{justify-content:center}

  /* timed exam ------------------------------------------------------ */
  .exam-brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
  .exam-brief > div{display:grid;gap:2px;padding:16px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);text-align:center}
  .exam-figure{font-size:1.45rem;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .exam-bar{
    position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;padding:11px 14px;margin:-4px 0 16px;border-radius:10px;
    background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow);
  }
  .exam-timer{display:flex;align-items:baseline;gap:8px}
  .exam-clock{font-size:1.4rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--text)}
  .exam-clock.warn{color:var(--danger);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  .exam-questions{padding-left:0;list-style:none}
  .q-number{
    display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;
    margin-right:8px;border-radius:5px;background:var(--panel-3);
    font-size:.7rem;font-weight:650;color:var(--muted);vertical-align:middle;
  }
  .option.selected{border-color:var(--text);background:var(--panel-3);color:var(--text)}
  .option.static{cursor:default}
  .option.static:hover{background:var(--panel);border-color:var(--line)}
  .option.static.correct:hover{background:var(--good-soft)}
  .option.static.wrong:hover{background:var(--danger-soft)}
  .result-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
  .result-score{font-size:2.3rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .result-score .muted{font-size:1.15rem;font-weight:500}
  .result-percent{font-size:1.05rem;color:var(--muted)}
  .result-meter{height:5px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin:12px 0 4px}
  .result-meter > span{display:block;height:100%;background:var(--text)}
  .review-head{margin:18px 0 10px;font-size:.95rem}
  .q-correct .q-text,.q-wrong .q-text{font-weight:600}
  @media (max-width:640px){ .exam-brief{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* coverage chips -------------------------------------------------- */
  .coverage{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .coverage-item{
    display:inline-flex;align-items:center;gap:7px;max-width:100%;
    padding:2px 3px 2px 9px;border-radius:99px;font-size:.76rem;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    overflow-wrap:anywhere;
  }
  .coverage-item > span{
    min-width:19px;padding:0 6px;border-radius:99px;text-align:center;
    background:var(--panel-3);font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);
  }
  .coverage-item.empty{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .coverage-item.empty > span{background:rgba(161,98,7,.12);color:var(--warn)}

  /* documents tab --------------------------------------------------- */
  .doc-layout{display:grid;grid-template-columns:minmax(200px,270px) minmax(0,1fr);gap:16px;align-items:start}
  .doc-side{padding:10px}
  .doc-list{display:grid;gap:1px}
  .doc-item{
    display:flex;align-items:center;gap:9px;width:100%;padding:7px;border:1px solid transparent;
    border-radius:8px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;
  }
  .doc-item:hover{background:var(--panel-2)}
  .doc-item.active{background:var(--panel-3);border-color:var(--line)}
  .doc-item-main{display:grid;gap:1px;min-width:0;flex:1}
  .doc-item-name{font-size:.83rem;font-weight:540;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-item .res-icon{width:27px;height:27px;font-size:.55rem}
  @media (max-width:860px){ .doc-layout{grid-template-columns:1fr} .doc-side{order:-1} }

  /* one-time sharing ----------------------------------------------- */
  .share-link{display:flex;gap:8px;align-items:center;margin:12px 0}
  .share-link input{
    flex:1;min-width:0;font:.82rem ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--panel-2);border:1px solid var(--line-2);
  }
  .share-docs{display:grid;gap:14px}
  .share-docs .panel-head{align-items:flex-start}
  .share-docs .panel-head h2{font-size:.95rem;overflow-wrap:anywhere}
  .share-docs .res-icon{width:30px;height:30px;font-size:.56rem}

  /* live document (streaming) --------------------------------------- */
  .live-doc-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .live-dot{
    display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:99px;
    background:var(--warn);vertical-align:middle;animation:live-pulse 1.4s ease-in-out infinite;
  }
  .badge.processing .live-dot{margin-right:5px;background:var(--warn)}
  @keyframes live-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .live-doc-wrap{
    max-height:62vh;overflow:auto;padding:2px 6px 2px 2px;
    border-left:2px solid var(--line-2);padding-left:16px;
  }
  .live-doc{position:relative}
  .live-doc > :last-child::after{
    content:"";display:inline-block;width:7px;height:1.05em;margin-left:3px;
    background:var(--text);vertical-align:-2px;animation:caret 1.05s steps(2) infinite;
  }
  @keyframes caret{0%,45%{opacity:1}55%,100%{opacity:0}}

  /* job bar --------------------------------------------------------- */
  .job-bar{
    position:fixed;right:22px;bottom:88px;z-index:40;width:min(400px,calc(100vw - 44px));
    display:grid;gap:9px;padding:14px 16px;border-radius:12px;
    background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);
  }
  .job-bar[hidden]{display:none}
  .job-info{display:grid;gap:3px}
  .job-title{font-weight:600;font-size:.86rem}
  .job-step{color:var(--muted);font-size:.78rem}
  .job-bar .btn{justify-self:end}
  .job-bar .meter{height:4px}

  /* toasts ---------------------------------------------------------- */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
  .toast{
    padding:8px 14px;border-radius:8px;background:var(--text);color:var(--bg);
    font-size:.82rem;box-shadow:var(--shadow-pop);animation:toast-in .18s ease-out;
  }
  .toast.success{background:var(--good);color:#fff}
  .toast.error{background:var(--danger);color:#fff}
  .toast.leaving{opacity:0;transform:translateY(6px);transition:all .25s}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* modal ----------------------------------------------------------- */
  .modal-root{position:fixed;inset:0;z-index:70;display:grid;place-items:center}
  .modal-root[hidden]{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(17,17,17,.32);backdrop-filter:blur(4px)}
  .modal{
    position:relative;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 60px);overflow:auto;
    background:var(--bg);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-pop);
    display:grid;gap:0;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 0}
  .modal-head h2{font-size:1rem}
  .modal-body{padding:14px 20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg-2);border-radius:0 0 14px 14px}

  /* collapsed sidebar ---------------------------------------------- */
  body.nav-collapsed{--sidebar-w:74px}
  body.nav-collapsed .brand-text,
  body.nav-collapsed .nav-label,
  body.nav-collapsed .nav-text,
  body.nav-collapsed .nav-item .count,
  body.nav-collapsed .user-meta,
  body.nav-collapsed .storage{display:none}
  body.nav-collapsed .sidebar{padding:16px 10px;align-items:stretch}
  body.nav-collapsed .sidebar-top{flex-direction:column;gap:8px;align-items:center;padding-bottom:10px}
  body.nav-collapsed .nav-item{justify-content:center;padding:8px}
  body.nav-collapsed .nav-add{display:none}
  body.nav-collapsed .user-row{justify-content:center}
  body.nav-collapsed #btn-collapse svg{transform:rotate(180deg)}

  @media (max-width:1100px){ .view{padding:26px 28px 110px} }
  @media (max-width:980px){
    .kit-layout{grid-template-columns:1fr}
    .field-row{grid-template-columns:1fr}
    .kit-card{grid-template-columns:auto minmax(0,1fr)}
    .kit-actions{grid-column:1 / -1;justify-content:flex-start}
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;inset:0 auto 0 0;width:248px;height:100vh;transform:translateX(-102%);
      transition:transform .2s ease;z-index:50;box-shadow:var(--shadow-pop);
    }
    body.nav-open .sidebar{transform:none}
    body.nav-collapsed{--sidebar-w:248px}
    body.nav-collapsed .brand-text,body.nav-collapsed .nav-label,body.nav-collapsed .nav-text,
    body.nav-collapsed .nav-item .count,body.nav-collapsed .user-meta,body.nav-collapsed .storage{display:revert}
    .sidebar-top{flex-direction:row}
    .menu-btn{display:grid}
    .topbar{padding:9px 16px}
    .view{padding:20px 16px 120px}
    .fab{right:16px;bottom:16px}
    .job-bar{right:12px;left:12px;width:auto;bottom:76px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="#/" aria-label="Symus Study home">
        <span class="brand-mark">S</span>
        <span class="brand-text"><b>symus</b><span>study</span></span>
      </a>
      <div class="sidebar-tools">
        <button class="icon-btn" id="btn-theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn" id="btn-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>

    <nav class="nav" id="nav-classes" aria-label="Library"></nav>

    <div class="sidebar-foot">
      <div class="user-row">
        <span class="avatar" aria-hidden="true">S</span>
        <div class="user-meta">
          <strong>You</strong>
          <span id="user-meta-line">Stored in this browser</span>
        </div>
      </div>
      <div class="storage" id="storage-meter"></div>
      <button class="nav-item" id="btn-settings" title="Settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></svg></span>
        <span class="nav-text">Settings</span>
      </button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-menu" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search"><input id="search" type="search" placeholder="Search study kits and resources…  (⌘K)" aria-label="Search study kits and resources"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-export" title="Export a JSON backup" aria-label="Export a backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-import" title="Import a backup" aria-label="Import a backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 19h14"/></svg>
        </button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<button class="fab" id="btn-new-kit" title="New study kit" aria-label="New study kit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="job-bar" id="job-bar" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal-root" id="modal-root" hidden></div>
<input type="file" id="pdf-file-input" accept=".pdf,application/pdf" multiple hidden>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<!--
  ARCH.js runtime (https://chibbit-99.github.io/arch.js/docs/).

  ARCH.js fetches ./arch/config.json, loads the modules listed there
  (npmloader.js), runs ./arch/init.js and waits for it, then executes the
  project files in config.json -> "js" in order.

  `latest.js` is used because the documented arch/init.js export syntax is only
  supported by the current build; releases/v0.1.1-alpha.js executes init.js as a
  plain async function, where `export const` is a syntax error.
-->
<script src="https://chibbit-99.github.io/arch.js/releases/latest.js"></script>
<script>
  // Fallback only for the case where ARCH.js itself never starts. Without it
  // the page would stay inert if the runtime CDN is blocked or the runtime
  // fails before reading arch/config.json. src/main.js refuses to run twice,
  // so a late ARCH.js start cannot double-initialise the app.
  (function () {
    var done = false;

    function loadDirectly(reason) {
      if (done || window.__symusStudyBooted) return;
      done = true;
      console.warn("[Symus Study] " + reason + "; loading the project files directly.");
      [
        "./src/store.js?v=2026-10-22e",
        "./src/markdown.js?v=2026-10-22e",
        "./src/ocr.js?v=2026-10-22e",
        "./src/ai.js?v=2026-10-22e",
        "./src/jobs.js?v=2026-10-22e",
        "./src/share.js?v=2026-10-22e",
        "./src/ui.js?v=2026-10-22e",
        "./src/main.js?v=2026-10-22e",
      ].forEach(function (src) {
        var script = document.createElement("script");
        script.src = src;
        script.async = false; // keep the file order
        document.body.appendChild(script);
      });
    }

    setTimeout(function () {
      if (window.__symusStudyBooted) return;
      if (typeof globalThis.importPackage !== "function") loadDirectly("ARCH.js did not load");
    }, 10000);

    setTimeout(function () {
      loadDirectly("ARCH.js did not finish starting");
    }, 90000);

    window.addEventListener("symus-study:booted", function () {
      done = true;
    });
  })();
</script>
</body>
